# Purify ad-tech fingerprint registry (proprietary; written for this project).
#
# Each vendor may define:
#   script:   regexes matched against script / resource URLs (loaded or referenced)
#   network:  regexes matched against network request URLs that indicate the integration
#             is *executing* (ad/bid requests). Observed only in rendered scans.
#   globals:  JS global names checked in rendered pages (dotted paths allowed)
#   html:     regexes matched against raw HTML (static evidence, weaker)
#   ads_txt:  ad-system domains as they appear in ads.txt field #1
#   bidders:  Prebid bidder codes that map to this vendor
#
# Matching rules are case-insensitive. Evidence -> status mapping lives in detector.py and is
# deliberately conservative: nothing here proves auctions, fill, revenue or contracts.
version: 2026.10.1

vendors:
  # ------------------------------------------------------------------ Google
  - key: google_gam
    name: Google Ad Manager (GPT)
    category: ad_server
    script: ['securepubads\.g\.doubleclick\.net/tag/js/gpt\.js', 'googletagservices\.com/tag/js/gpt\.js', 'securepubads\.g\.doubleclick\.net/pagead/managed/js/gpt/']
    network: ['(securepubads|pubads)\.g\.doubleclick\.net/gampad/ads']
    globals: ['googletag.pubadsReady', 'googletag.apiReady']
    html: ['googletag\.defineSlot\(', 'googletag\.pubads\(\)', '/gampad/ads\?']
  - key: google_adsense
    name: Google AdSense
    category: adsense
    script: ['pagead2\.googlesyndication\.com/pagead/js/adsbygoogle\.js']
    network: ['googleads\.g\.doubleclick\.net/pagead/ads\?', 'pagead2\.googlesyndication\.com/pagead/ads\?']
    globals: ['adsbygoogle.loaded']
    html: ['class=["''][^"'']*adsbygoogle', 'data-ad-client=["'']ca-pub-\d+', 'google_ad_client']
  - key: google_ads_txt
    name: Google (AdSense / AdX / Ad Manager authorisation)
    category: declared_google
    ads_txt: ['google.com']
  - key: google_ima
    name: Google IMA SDK (video ads)
    category: video
    script: ['imasdk\.googleapis\.com/js/sdkloader/ima3']
    globals: ['google.ima']

  # ------------------------------------------------------------------ header bidding wrappers
  - key: prebid
    name: Prebid.js
    category: header_bidding
    script: ['prebid[\w.\-]*\.js', '/prebid/']
    globals: ['pbjs.version']  # detector also reads window._pbjsGlobals for renamed instances
    html: ['pbjs\.requestBids', 'pbjs\.addAdUnits', '_pbjsGlobals']
  - key: amazon_aps
    name: Amazon Publisher Services (TAM/UAM)
    category: header_bidding
    script: ['c\.amazon-adsystem\.com/aax2/apstag\.js']
    network: ['aax\.amazon-adsystem\.com/e/dtb/bid']
    globals: ['apstag.fetchBids']
    html: ['apstag\.init\(']
    ads_txt: ['amazon-adsystem.com', 'aps.amazon.com']
    bidders: ['amazon']
  - key: pubmatic_openwrap
    name: PubMatic OpenWrap
    category: header_bidding
    script: ['ads\.pubmatic\.com/adserver/js/pwt/']
    globals: ['PWT.requestBids']

